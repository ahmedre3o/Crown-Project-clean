steps:
  - name: gcr.io/cloud-builders/docker
    dir: .
    args: ["build", "-f", "frontend/Dockerfile.web", "-t", "gcr.io/$PROJECT_ID/crown-web", "--build-arg=NEXT_PUBLIC_API_URL=https://crown-api-av27y5zkga-uc.a.run.app/api", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/crown-web"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - crown-web
      - --image
      - gcr.io/$PROJECT_ID/crown-web
      - --region
      - us-central1
      - --allow-unauthenticated
      - --set-env-vars
      - NEXT_PUBLIC_API_URL=https://crown-api-av27y5zkga-uc.a.run.app/api

options:
  logging: CLOUD_LOGGING_ONLY
