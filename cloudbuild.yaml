# Build Next.js frontend for crown-web with NEXT_PUBLIC_API_URL at build time.
# Usage: gcloud builds submit --config=cloudbuild.yaml [--substitutions=_NEXT_PUBLIC_API_URL=https://...]

substitutions:
  _REGION: us-central1
  _PROJECT_ID: gen-lang-client-0711622878
  _SERVICE: crown-web
  _NEXT_PUBLIC_API_URL: https://crown-api-756273570281.us-central1.run.app
  _IMAGE_TAG: latest

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_IMAGE_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_IMAGE_TAG}'
    waitFor: [build]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_IMAGE_TAG}'
      - '--region=${_REGION}'
      - '--project=${_PROJECT_ID}'
      - '--platform=managed'
      - '--allow-unauthenticated'
    waitFor: [push]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
